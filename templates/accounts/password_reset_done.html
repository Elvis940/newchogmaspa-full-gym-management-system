<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Email Sent - New Chogma-SPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #1a1a1a;
            --primary-light: #2d2d2d;
            --accent: #c9a74d;
            --text-light: #f8f9fa;
            --text-muted: #adb5bd;
        }
        
        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1770&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.85);
            z-index: -1;
        }
        
        .auth-container {
            background: rgba(45, 45, 45, 0.9);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        
        .auth-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
        }
        
        .auth-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .auth-message {
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--primary-dark);
            font-weight: 600;
            padding: 12px;
        }
        
        .btn-primary:hover {
            background-color: #b89740;
            border-color: #b89740;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
        }
        
        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-icon">
                <i class="fas fa-envelope"></i>
            </div>
            <h1 class="auth-title">Check Your Email</h1>
            <p class="auth-message">
                We've sent password reset instructions to your email address. 
                Please check your inbox and follow the link to reset your password.
            </p>
            <p class="auth-message">
                If you don't see the email, please check your spam folder or 
                <a href="{% url 'password_reset' %}">try again</a>.
            </p>
            
            <div class="auth-footer">
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="fas fa-arrow-left me-2"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
